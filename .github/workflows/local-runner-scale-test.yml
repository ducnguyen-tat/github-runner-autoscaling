name: Local runner scale-set test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: local-linux-x64
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: [1, 2, 3, 4]
    steps:
      - name: Verify runner and hold briefly
        shell: bash
        run: |
          set -euo pipefail
          echo "Matrix job: ${{ matrix.job }}"
          hostname
          uname -m
          id
          sleep 60